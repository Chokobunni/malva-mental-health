services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: malva
      POSTGRES_USER: malva
      POSTGRES_PASSWORD: malva_dev_password
    ports:
      - "5432:5432"
    volumes:
      - malva_postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malva -d malva"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  malva_postgres:
