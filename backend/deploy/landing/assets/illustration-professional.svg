<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 720" width="380" height="720" role="img" aria-labelledby="t3">
  <title id="t3">Ilustrasi panel profesional: skor DASS-21 dan WHO-5 beserta tren pasien</title>
  <rect x="0" y="0" width="380" height="720" rx="28" fill="#FCFAFD"/>
  <defs>
    <linearGradient id="hdr3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3F205B"/>
      <stop offset="0.6" stop-color="#B75ECB"/>
      <stop offset="1" stop-color="#EFA0EC"/>
    </linearGradient>
  </defs>
  <path d="M0 0h380v118a28 28 0 0 1-28 28H28A28 28 0 0 1 0 118Z" fill="url(#hdr3)"/>
  <text x="26" y="52" font-family="Segoe UI, Roboto, sans-serif" font-size="22" font-weight="700" fill="#FCFAFD">Panel profesional</text>
  <text x="26" y="80" font-family="Segoe UI, Roboto, sans-serif" font-size="13" fill="#FCFAFD" opacity="0.9">Hasil asesmen &amp; tren pasien</text>
  <rect x="26" y="96" width="190" height="8" rx="4" fill="#FCFAFD"/>

  <!-- Kartu skor DASS-21 -->
  <rect x="20" y="176" width="340" height="158" rx="18" fill="#FFFFFF" stroke="#5D2E7E" stroke-opacity="0.12"/>
  <text x="38" y="206" font-family="Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#5D2E7E">Hasil DASS-21</text>
  <text x="38" y="228" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#6c6376">Depresi, kecemasan, stres — skala 1-3</text>

  <text x="46" y="262" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#4c4354">Depresi</text>
  <rect x="46" y="270" width="248" height="10" rx="5" fill="#5D2E7E" fill-opacity="0.12"/>
  <rect x="46" y="270" width="44" height="10" rx="5" fill="#36C7A6"/>
  <text x="304" y="280" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="800" fill="#1e8f76">Normal</text>

  <text x="46" y="300" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#4c4354">Kecemasan</text>
  <rect x="46" y="308" width="248" height="10" rx="5" fill="#5D2E7E" fill-opacity="0.12"/>
  <rect x="46" y="308" width="86" height="10" rx="5" fill="#E58BE8"/>
  <text x="304" y="318" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="800" fill="#8E44AD">Ringan</text>

  <!-- Grafik tren -->
  <rect x="20" y="352" width="340" height="216" rx="18" fill="#FFFFFF" stroke="#5D2E7E" stroke-opacity="0.12"/>
  <text x="38" y="382" font-family="Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#5D2E7E">Tren WHO-5</text>
  <text x="38" y="404" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#6c6376">Persentase kesejahteraan tiap pengukuran</text>
  <line x1="52" y1="546" x2="330" y2="546" stroke="#5D2E7E" stroke-opacity="0.18" stroke-width="1"/>
  <polyline points="58,510 104,486 150,496 196,452 242,466 288,428 326,436"
            fill="none" stroke="#5D2E7E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="58" cy="510" r="6" fill="#B65ACB"/>
  <circle cx="104" cy="486" r="6" fill="#B65ACB"/>
  <circle cx="150" cy="496" r="6" fill="#B65ACB"/>
  <circle cx="196" cy="452" r="6" fill="#B65ACB"/>
  <circle cx="242" cy="466" r="6" fill="#B65ACB"/>
  <circle cx="288" cy="428" r="6" fill="#B65ACB"/>
  <circle cx="326" cy="436" r="6" fill="#36C7A6"/>
  <text x="52" y="562" font-family="Segoe UI, Roboto, sans-serif" font-size="10" fill="#6c6376">Minggu 1</text>
  <text x="196" y="562" font-family="Segoe UI, Roboto, sans-serif" font-size="10" fill="#6c6376">Minggu 3</text>
  <text x="286" y="562" font-family="Segoe UI, Roboto, sans-serif" font-size="10" fill="#6c6376">Minggu 5</text>

  <!-- Daftar akses data dengan izin -->
  <rect x="20" y="586" width="340" height="118" rx="18" fill="#FFFFFF" stroke="#5D2E7E" stroke-opacity="0.12"/>
  <text x="38" y="614" font-family="Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#5D2E7E">Data yang dibagikan pasien</text>
  <circle cx="46" cy="636" r="6" fill="#36C7A6"/>
  <text x="60" y="641" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#4c4354">Skor DASS-21 &amp; WHO-5</text>
  <circle cx="46" cy="660" r="6" fill="#36C7A6"/>
  <text x="60" y="665" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#4c4354">Worksheet terapi</text>
  <circle cx="46" cy="684" r="6" fill="#E58BE8"/>
  <text x="60" y="689" font-family="Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#4c4354">Mood &amp; diary (sesuai izin)</text>
</svg>
