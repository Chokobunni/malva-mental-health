components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
  responses:
    OK:
      description: "Permintaan berhasil."
      content:
        application/json:
          schema:
            type: object
    BadRequest:
      description: "Permintaan tidak valid."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: "Token tidak ada atau tidak valid."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: "Pengguna tidak berhak atas sumber daya ini."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: "Sumber daya tidak ditemukan."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: "Data tidak dapat diproses."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: "Kesalahan internal server."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
