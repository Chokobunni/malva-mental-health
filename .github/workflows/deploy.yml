name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - name: Build Go backend
        working-directory: backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o malva-api ./cmd/api
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o malva-api.exe ./cmd/api
      - name: Build Flutter Web
        run: |
          flutter pub get
          flutter build web --release --dart-define=MALVA_API_BASE_URL=${{ vars.API_URL }}
      - name: Create release archive
        run: |
          tar -czf malva-backend-linux.tar.gz -C backend malva-api
          tar -czf malva-web.tar.gz -C build/web .
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            malva-backend-linux.tar.gz
            malva-web.tar.gz
            backend/malva-api.exe
          retention-days: 30

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-release
    if: github.event.inputs.environment == 'staging' || startsWith(github.ref, 'refs/tags/v')
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - name: Deploy to staging server
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          echo "Deploy to staging: $DEPLOY_HOST"
          # Add actual deployment commands here
          # scp malva-backend-linux.tar.gz $DEPLOY_USER@$DEPLOY_HOST:/opt/malva/
          # ssh $DEPLOY_USER@$DEPLOY_HOST 'cd /opt/malva && tar -xzf malva-backend-linux.tar.gz && systemctl restart malva-api'

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event.inputs.environment == 'production'
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - name: Deploy to production server
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST_PROD }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER_PROD }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY_PROD }}
        run: |
          echo "Deploy to production: $DEPLOY_HOST"
          # Add actual deployment commands here
