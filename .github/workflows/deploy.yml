name: Deploy All (manual)

# Orkestrator manual: pilih mau deploy apa saja tanpa menunggu push.
# Workflow ini memanggil tiga workflow reusable di folder yang sama.
#
#   backend → deploy-backend.yml
#   web     → deploy-web.yml
#   apk     → build-apk.yml
#
# Untuk deploy otomatis, cukup push ke main; masing-masing workflow punya
# trigger path-nya sendiri. File ini hanya untuk tombol "Run workflow".

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Yang mau di-deploy'
        required: true
        type: choice
        default: all
        options:
          - all
          - backend
          - web
          - apk

permissions:
  contents: read

jobs:
  backend:
    name: Backend API
    if: ${{ inputs.target == 'all' || inputs.target == 'backend' }}
    uses: ./.github/workflows/deploy-backend.yml
    secrets: inherit

  web:
    name: Website
    if: ${{ inputs.target == 'all' || inputs.target == 'web' }}
    uses: ./.github/workflows/deploy-web.yml
    secrets: inherit

  apk:
    name: APK
    if: ${{ inputs.target == 'all' || inputs.target == 'apk' }}
    uses: ./.github/workflows/build-apk.yml
    secrets: inherit
