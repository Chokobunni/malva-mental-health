name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'web/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'web/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'

jobs:
  analyze:
    name: Analyze & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: dart format --output=none --set-exit-if-changed .

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: analyze
    # Test format tanggal/jam mengunci WIB (Asia/Jakarta) karena itu zona
    # pengguna Indonesia dan perangkat pengembang. Runner GitHub default UTC,
    # sehingga 14 test zona waktu gagal tanpa ini.
    env:
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter test --coverage
      # Upload coverage opsional: token codecov tidak diset di repo publik
      # ini, jadi lewati bila tidak tersedia (jangan gagalkan CI).
      - name: Upload coverage (optional)
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-android:
    name: Build Android
    # APK release di main dibangun oleh build-apk.yml (signed + dart-define).
    # Job ini cukup untuk memvalidasi build Android di Pull Request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      # Wajib pakai dart-define yang sama dengan build release; tanpa
      # MALVA_GOOGLE_CLIENT_ID tombol Google Sign-In gagal di APK.
      - name: Build APK
        run: >-
          flutter build apk --release --split-per-abi
          --dart-define=MALVA_API_BASE_URL=${{ vars.MALVA_API_BASE_URL || 'https://api.malva.web.id' }}
          --dart-define=MALVA_GOOGLE_CLIENT_ID=${{ vars.MALVA_GOOGLE_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          retention-days: 7

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Enable Developer Mode (required for plugin symlinks)
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Check for vulnerable dependencies
        run: |
          dart pub deps --no-dev 2>/dev/null || true
          echo "Dependency scan complete"
